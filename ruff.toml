extend-include = ["*.ipynb"]

# Assume Python 3.11
target-version = "py311"

[format]
docstring-code-format = true
docstring-code-line-length = 20

[lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "C90", # mccabe 90
    "I", # isort
    "N", # pep8-naming
    "D", # pydocstyle
    "UP", # pyupgrade
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B", # flake8-bugbear
    "A", # flake8-builtins
    #b "COM", # flake8-commas (conflicts with formatter)
    "CPY", # flake8-copyright
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    # "DJ", # flake8-django (N/A)
    "EM", # flake8-error-message
    "EXE", # flake8-executable
    # "FA", # flake8-future-annotations (we're not worried about back-compat this deep)
    # "ISC", # flake8-implicit-str-contact (conflicts with formatter)
    "ICN", # flake8-import-conventions
    "LOG", # flake8-logging
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest
    "Q",  # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TC", # flake8-type-checking
    "INT", # flake8-gettext 
    "ARG", # flake8-unused-argument
    "PTH", # flake8-use-pathlib
    "TD", # flake8-todos
    # "FIX", # flake8-fixme (throws on all todos)
    "ERA", # flake8-eradicate
    "PD", # pandas-vet
    "PGH", # pygrep-hooks
    # "PL", # pylint (this is popping a lot of issues)
    "TRY", # tryceratops
    "FLY", # flynt
    "NPY", # numpy-specific-rules
    # "FAST", # fastAPI (n/a)
    # "AIR", # airflow (n/a)
    "PERF", # perflint
    "FURB", # refurb
    # "DOC", # pydoclint (need to document returns
    "RUF", # ruff-specific rules
    
]
ignore = [
    "line-too-long", # Line too long, handled by formatter    
    "any-type", # Disable typing.Any; this is used a fair amount
    "unused-method-argument", # Conflicts with interface argument checking
    "incorrectly-parenthesized-tuple-in-subscript", # Avoid parentheses with tuples; this causes issues with some networkx edge lookups
    "runtime-cast-value", # Use quotes in casted types; this is kind of weird and seems like it would affect refactoring
    "missing-todo-link", # We're not tracking TODOs as issues ,
    "blanket-type-ignore", # Use specific rule when ignoring issue - need a way to by bypass Pylint checks; this raises on type: ignore
    "boolean-type-hint-positional-argument", "boolean-default-value-positional-argument", # Disable default positional boolean.
    # The following preview rules were newly surfaced by the ruff 0.15 upgrade on
    # pre-existing code. They are ignored here to keep the dependency-update sweep
    # focused; address them in a dedicated lint-cleanup pass.
    "float-equality-comparison", # float-equality-comparison
    "blocking-path-method-in-async-function", # blocking-path-method-in-async-function
    "incorrect-section-order", # incorrect-section-order
    "property-docstring-starts-with-verb", # property-docstring-starts-with-verb
    "unnecessary-if", # unnecessary-if
    "non-empty-init-module", # non-empty-init-module
]

[lint.per-file-ignores]
"tests/*" = ["S", "D", "ANN", "print", "ASYNC", "ARG", "PTH", "TRY", "private-member-access", "DOC"]
"*.ipynb" = ["print"]
# Stats/reporting modules that intentionally use print for CLI output
"benchmark_qed/autoq/question_gen/data_questions/assertion_gen/stats.py" = ["print"]
"benchmark_qed/autoe/retrieval_metrics/relevance_assessment/compare_raters.py" = ["print"]

[lint.mccabe]
# The default here is 10, and we should try to bring this down. 27 is pretty high.
max-complexity = 27

[lint.flake8-builtins]
builtins-ignorelist = ["input", "id", "bytes"]

[lint.pydocstyle]
convention = "numpy"

[lint.flake8-copyright]
notice-rgx = "(?i)Copyright \\(C\\) (\\d{4} )?Microsoft Corporation"
